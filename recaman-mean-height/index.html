<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mean-Height Coordinates, Divergence, and Collision Locality in Recamán's Sequence</title>
  <meta name="description" content="A preprint on structural properties of Recamán's sequence by Brandon Mikowski.">
  <style>
    :root { color-scheme: light; }
    html { background:#fdfdfd; color:#1b1b1b; font-family: Georgia, "Times New Roman", serif; }
    body { max-width: 780px; margin:0 auto; padding:48px 28px 80px; line-height:1.58; }
    h1,h2,h3 { line-height:1.2; margin-top:1.7em; }
    h1:first-child { margin-top:0; }
    a { color:#174ea6; }
    table { border-collapse:collapse; width:100%; display:block; overflow-x:auto; margin:1.2rem 0; }
    th,td { border-bottom:1px solid #bbb; padding:.45rem .65rem; text-align:left; }
    blockquote { border-left:3px solid #bbb; padding-left:1rem; margin-left:0; color:#444; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.92em; }
    mjx-container[jax="CHTML"][display="true"] { overflow-x:auto; overflow-y:hidden; padding:.25rem 0; }
    .loading { color:#666; }
    .error { color:#8b0000; white-space:pre-wrap; }
    @media (max-width:600px) { body { padding:24px 16px 56px; font-size:16px; } h1 { font-size:1.75rem; } }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        processEscapes: true
      },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <main id="paper"><p class="loading">Loading preprint…</p></main>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      const root = document.getElementById('paper');
      try {
        const res = await fetch('./index.md', { cache: 'no-store' });
        if (!res.ok) throw new Error('Could not load index.md (' + res.status + ')');
        let md = await res.text();
        md = md.replace(/^---[\s\S]*?---\s*/, '');
        if (!window.marked) throw new Error('Markdown renderer did not load.');
        root.innerHTML = marked.parse(md, { gfm: true, breaks: false });
        if (window.MathJax && MathJax.typesetPromise) {
          await MathJax.typesetPromise([root]);
        }
      } catch (err) {
        root.innerHTML = '<h1>Preprint</h1><p class="error">' + String(err) + '</p>';
      }
    });
  </script>
</body>
</html>
